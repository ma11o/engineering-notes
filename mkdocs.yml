site_name: Engineering Notes
site_url: https://ma11o.github.io/engineering-notes/
repo_url: https://github.com/ma11o/engineering-notes
edit_uri: edit/main/logging/
docs_dir: logging

theme:
  name: material
  language: ja
  features:
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え

plugins:
  - search:
      lang: ja

markdown_extensions:
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences

nav:
  - ログ設計を理解する: README.md
  - 共通例1：レポート出力ジョブ: example.md
  - 共通例2：予約の問い合わせ: example-reservation.md
  - ログ設計の原則: principles.md
  - イベントの設計: event-design.md
  - 処理をつなぐID: correlation.md
  - レベル・結果・通知: severity-and-outcomes.md
  - 情報を守る: security-and-privacy.md
  - 記録の届き方と限界: reliability.md
  - 設計をレビューする: review-checklist.md
  - 製品別の実践:
      - New Relic と CloudWatch の役割分担: tools/newrelic-cloudwatch.md
  - リサーチ資料:
      - research/README.md
      - 書籍ノート: research/reading-notes.md
      - イベントと相関の根拠: research/sources/event-correlation.md
      - レベル・結果・通知の根拠: research/sources/severity-outcomes.md
      - 情報保護と記録保証の根拠: research/sources/log-guarantees.md
      - 判断の理由を記録する先行例: research/sources/decision-reasons.md
      - 論点別の補足: research/external-evidence.md
      - レビュー観点と試験の対応表: research/review-test-matrix.md
